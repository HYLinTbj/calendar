    // ─────────────────────────────────────────────
    // MAIN CALENDAR APP
    // ─────────────────────────────────────────────
    function CalendarApp({ user, onLogout, nav }) {
      const [view,setView]   = React.useState('month');
      const [date,setDate]   = React.useState(new Date());
      const [calendars,setCals] = React.useState([]);
      const [rawCats,setCats]= React.useState([]);
      const [groups,setGroups]= React.useState([]);
      const [events,setEvts] = React.useState([]);
      const [traces,setTraces] = React.useState([]);
      const tracesReq = React.useRef(0); // number of the latest traces request
      const [hiddenAreas,setHiddenAreas]=React.useState(()=>loadHiddenAreas(user?.id));
      const [selCals,setSel] = React.useState(new Set());
      const [modal,setModal] = React.useState(null);   // { event?, defaultDate? }
      const [newCal,setNewCal]= React.useState(false);
      const [areaModal,setAreaModal]=React.useState(null); // {groupId} for new | area | null
      const [groupModal,setGroupModal]=React.useState(null); // 'new' | group | null
      const [search,setSearch]= React.useState('');
      const [showSearch,setShowSearch]=React.useState(false);

      // load catalogs once
      React.useEffect(()=>{
        api('/calendars').then(d=>{ const cs=d||[]; setCals(cs); setSel(new Set(cs.map(c=>c.id))); }).catch(()=>{});
        loadAreas();
      },[]);
      function loadAreas(){
        api('/categories').then(d=>setCats(d||[])).catch(()=>{});
        api('/category-groups').then(d=>setGroups(d||[])).catch(()=>{});
      }
      const cats = React.useMemo(()=>resolveAreas(rawCats,groups),[rawCats,groups]);

      // load events for current range + selected calendars
      function loadEvents() {
        loadTraces(); // traces belong to no calendar, so they load whichever are selected
        if(calendars.length===0) return;
        const ids=[...selCals]; if(ids.length===0){setEvts([]);return;}
        let from,to;
        if(view==='month'){
          const s=startOfWeek(startOfMonth(date));
          from=s.toISOString(); to=addDays(s,42).toISOString(); // through the grid's 42nd cell
        } else if(view==='week'){
          from=startOfWeek(date).toISOString(); to=endOfWeek(date).toISOString();
        } else {
          const s=new Date(date); s.setHours(0,0,0,0);
          const e=new Date(date); e.setHours(23,59,59,999);
          from=s.toISOString(); to=e.toISOString();
        }
        // overlap: also events that started before the range but still run into it — a
        // multi-day all-day event, or (west of UTC) one stored at UTC midnight of the
        // first visible day. Views place events by date, so out-of-range days aren't shown.
        Promise.all(ids.map(id=>api(`/events?calendar_id=${id}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&overlap=true`).then(d=>d||[]).catch(()=>[])))
          .then(r=>{ const seen=new Set(); setEvts(r.flat().filter(e=>{ if(seen.has(e.id)) return false; seen.add(e.id); return true; })); });
      }
      // Traces show in the week and day views' strip under the day headers. Only the
      // latest request's answer is kept, so quick navigation can't land an older range's.
      function loadTraces() {
        const n=++tracesReq.current;
        if(view==='month'){ setTraces([]); return; }
        const days=view==='week'?getWeekDays(date):[date];
        api(tracesUrl(ymd(days[0]),ymd(days[days.length-1])))
          .then(d=>{ if(n===tracesReq.current) setTraces(d||[]); })
          .catch(()=>{ if(n===tracesReq.current) setTraces([]); });
      }
      React.useEffect(loadEvents,[view,date,calendars,selCals]);

      function navigate(dir) {
        setDate(d=>{ const n=new Date(d);
          if(view==='month')      n.setMonth(n.getMonth()+dir);
          else if(view==='week')  n.setDate(n.getDate()+dir*7);
          else                    n.setDate(n.getDate()+dir);
          return n; });
      }
      function toggleCal(id){ setSel(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; }); }
      function eventSaved(saved){ setEvts(es=>{ const i=es.findIndex(e=>e.id===saved.id); return i>=0?[...es.slice(0,i),saved,...es.slice(i+1)]:[...es,saved]; }); setModal(null); }
      function eventDeleted(id){ setEvts(es=>es.filter(e=>e.id!==id)); setModal(null); }
      // Drag-to-reschedule: optimistically move the event, PUT the new times, roll back on failure.
      async function eventMoved(evt, start, end){
        const startISO=start.toISOString(), endISO=end.toISOString();
        if(evt.start_time===startISO && evt.end_time===endISO) return;
        setEvts(es=>es.map(e=>e.id===evt.id?{...e,start_time:startISO,end_time:endISO}:e));
        try{
          const saved=await api(`/events/${evt.id}`,{method:'PUT',body:JSON.stringify({start_time:startISO,end_time:endISO})});
          setEvts(es=>es.map(e=>e.id===saved.id?saved:e));
        }catch(ex){
          // Roll back just this event's times so a concurrent change elsewhere
          // (another drag, a modal save) isn't reverted along with it.
          setEvts(es=>es.map(e=>e.id===evt.id?{...e,start_time:evt.start_time,end_time:evt.end_time}:e));
          alert('Could not move event: '+ex.message);
        }
      }
      function calCreated(c){ setCals(cs=>[...cs,c]); setSel(s=>new Set([...s,c.id])); setNewCal(false); }
      function catSaved(cat){ setCats(cs=>{ const i=cs.findIndex(c=>c.id===cat.id); return i>=0?[...cs.slice(0,i),cat,...cs.slice(i+1)]:[...cs,cat]; }); }
      function catDeleted(id){ setCats(cs=>cs.filter(c=>c.id!==id)); setAreaModal(null); }
      function groupSaved(g){ setGroups(gs=>{ const i=gs.findIndex(x=>x.id===g.id); return i>=0?[...gs.slice(0,i),g,...gs.slice(i+1)]:[...gs,g]; }); setGroupModal(null); }
      // Deleting a group ungroups its Areas server-side; reload them to match.
      function groupDeleted(){ setGroupModal(null); loadAreas(); }
      function toggleAreas(ids, hide){
        setHiddenAreas(h=>{ const n=new Set(h); ids.forEach(id=>hide?n.add(id):n.delete(id)); saveHiddenAreas(user?.id, n); return n; });
      }

      // An event tagged with someone else's Area (in a shared calendar) has none of
      // ours: it's coloured by its calendar, so it's shown and hidden with "No area".
      const visible = React.useMemo(()=>{
        const mine=new Set(cats.map(c=>c.id));
        return events.filter(e=>selCals.has(e.calendar_id) && !hiddenAreas.has(mine.has(e.category_id)?e.category_id:'none'));
      },[events,selCals,hiddenAreas,cats]);
      const eventDays = React.useMemo(()=>new Set(visible.flatMap(dayKeys)),[visible]);
      const visibleTraces = React.useMemo(()=>{
        const mine=new Set(cats.map(c=>c.id));
        return traces.filter(t=>!hiddenAreas.has(mine.has(t.category_id)?t.category_id:'none'));
      },[traces,hiddenAreas,cats]);

      return (
        <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
          <div style={{position:'relative',flexShrink:0}}>
            <Header view={view} onView={setView} currentDate={date} onNav={navigate}
              onToday={()=>setDate(new Date())} user={user} onLogout={onLogout}
              search={search} onSearch={v=>{ setSearch(v); setShowSearch(!!v); }}
              workspace={nav.workspace} onWorkspace={nav.setWorkspace}
              onLogged={loadEvents}/>
            {showSearch&&(
              <div style={{position:'absolute',right:164,top:'100%',zIndex:400}}>
                <SearchDropdown query={search} calendars={calendars} categories={cats}
                  onPick={evt=>setModal({event:evt})}
                  onClose={()=>{ setSearch(''); setShowSearch(false); }}/>
              </div>
            )}
          </div>

          <div style={{flex:1,display:'flex',overflow:'hidden'}}>
            <Sidebar currentDate={date}
              onDateSelect={d=>{ setDate(d); setView('day'); }}
              calendars={calendars} selCals={selCals} onToggleCal={toggleCal}
              categories={cats} groups={groups} hiddenAreas={hiddenAreas} onToggleAreas={toggleAreas} eventDays={eventDays}
              onNewEvent={()=>setModal({defaultDate:date})}
              onNewCalendar={()=>setNewCal(true)}
              onNewArea={groupId=>setAreaModal({groupId})}
              onEditArea={a=>setAreaModal(a)}
              onNewGroup={()=>setGroupModal('new')}
              onEditGroup={g=>setGroupModal(g)}/>

            <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
              {view==='month'&&<MonthView currentDate={date} events={visible} calendars={calendars} categories={cats} onDayClick={d=>setModal({defaultDate:d})} onEventClick={e=>setModal({event:e})}/>}
              {view==='week'&&<TimeGrid days={getWeekDays(date)} events={visible} traces={visibleTraces} onOpenLog={nav.openLog} calendars={calendars} categories={cats} onSlotClick={d=>setModal({defaultDate:d})} onEventClick={e=>setModal({event:e})} onEventDrop={eventMoved}/>}
              {view==='day'&&<TimeGrid days={[date]} events={visible} traces={visibleTraces} onOpenLog={nav.openLog} calendars={calendars} categories={cats} onSlotClick={d=>setModal({defaultDate:d})} onEventClick={e=>setModal({event:e})} onEventDrop={eventMoved}/>}
            </div>
          </div>

          {modal&&<EventModal event={modal.event} defaultDate={modal.defaultDate} calendars={calendars} categories={cats} groups={groups} onSave={eventSaved} onDelete={eventDeleted} onRefetch={loadEvents} onClose={()=>setModal(null)} onCategoryCreated={catSaved}/>}
          {newCal&&<NewCalendarModal onSave={calCreated} onClose={()=>setNewCal(false)}/>}
          {areaModal&&<AreaModal area={areaModal.id?areaModal:null} defaultGroupId={areaModal.groupId} groups={groups} onClose={()=>setAreaModal(null)}
            onSaved={cat=>{ catSaved(cat); setAreaModal(null); }} onDeleted={catDeleted}/>}
          {groupModal&&<GroupModal group={groupModal==='new'?null:groupModal} groups={groups} onClose={()=>setGroupModal(null)}
            onSaved={groupSaved} onDeleted={groupDeleted}/>}
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // TIMER CHIP — start/stop time tracking, shown in every workspace's header
    // ─────────────────────────────────────────────
    // A running timer is just an unsent event body parked in localStorage until
    // Stop POSTs it to /events — this app has no separate time-log entity to write
    // to. Keyed per user, so it can't leak into another account on the same browser.
    const timerKey = userId => `tempo_timer:${userId}`;
    const getTimer = userId => {
      try {
        const t = JSON.parse(localStorage.getItem(timerKey(userId)));
        return (t && t.start_time && !isNaN(new Date(t.start_time).getTime())) ? t : null;
      } catch { return null; }
    };
    const setTimer   = (userId,t) => localStorage.setItem(timerKey(userId), JSON.stringify(t));
    const clearTimer = userId => localStorage.removeItem(timerKey(userId));

    function TimerChip({ user, onLogged }) {
      const uid = user?.id;
      const [categories,setCategories] = React.useState([]);
      const [groups,setGroups]         = React.useState([]);
      const [running,setRunning]       = React.useState(()=>getTimer(uid));
      const [now,setNow]               = React.useState(new Date());
      const [picking,setPicking]       = React.useState(false);
      const [form,setForm]             = React.useState({category_id:'',title:''});
      const [busy,setBusy]             = React.useState(false);

      // Refetched each time the picker opens, so areas created or deleted since mount show up.
      // Groups only arrange the list, so if they fail to load the areas still show, ungrouped.
      const loadCategories = () => Promise.all([api('/categories'), api('/category-groups').catch(()=>[])])
        .then(([cs,gs])=>{ setGroups(gs||[]); setCategories(resolveAreas(cs||[], gs||[])); }).catch(()=>{});
      React.useEffect(()=>{ loadCategories(); },[]);

      // Follow starts/stops made in other tabs.
      React.useEffect(()=>{
        const sync = e => { if(e.key===null || e.key===timerKey(uid)) setRunning(getTimer(uid)); };
        window.addEventListener('storage', sync);
        return ()=>window.removeEventListener('storage', sync);
      },[uid]);

      React.useEffect(()=>{
        if(!running) return;
        const id=setInterval(()=>setNow(new Date()),1000);
        return ()=>clearInterval(id);
      },[running]);

      // The stored copy is the source of truth: another tab (or this view's previous
      // chip, mid-Stop) may have logged or replaced the timer this chip is showing.
      // Returns the stored timer if it's still the one on screen, else resyncs and returns null.
      function current() {
        const t=getTimer(uid);
        if(t && running && t.start_time===running.start_time) return t;
        setRunning(t); return null;
      }

      function start(e) {
        e.preventDefault();
        setPicking(false);
        const existing=getTimer(uid);
        if(existing){ setRunning(existing); return; } // started in another tab — adopt it, don't overwrite
        const t={ category_id: form.category_id||null, title: form.title.trim(), start_time: new Date().toISOString() };
        setTimer(uid,t); setRunning(t); setForm({category_id:'',title:''});
      }

      function discard() {
        if(!confirm('Discard this timer? The elapsed time will not be logged.')) return;
        if(!current()) return;
        clearTimer(uid); setRunning(null);
      }

      // The localStorage entry is the *only* copy of this session until the POST
      // succeeds. It's taken out while the POST runs, so no other chip or tab can Stop
      // (and log) it a second time, and put back if the POST fails — unless a new timer
      // was started meanwhile — so nothing is lost and Stop/Discard can be retried.
      async function stop() {
        const t=current();
        if(!t) return; // already logged/replaced elsewhere — posting this snapshot would double-count
        // Stats count whole minutes, so a sub-minute session is almost always a mis-click.
        if(Date.now()-new Date(t.start_time) < 60000){
          if(confirm('Less than a minute has passed — discard this timer instead of logging it?') && current()){ clearTimer(uid); setRunning(null); }
          return;
        }
        setBusy(true);
        clearTimer(uid);
        const restore=()=>{ if(!getTimer(uid)) setTimer(uid,t); };
        const areaName=(categories.find(c=>c.id===t.category_id)||{}).name;
        const endTime=new Date();
        const mins=Math.max(1, Math.round((endTime-new Date(t.start_time))/60000));
        // A short session is a trace: it keeps its day and minutes, not a slot on the
        // grid. A longer one is an event at the times it ran.
        const asTrace=mins<TRACE_CUTOFF_MIN;
        const [path,body,notFound]=asTrace
          ? ['/traces',{ category_id:t.category_id||null, day:ymd(new Date(t.start_time)), minutes:mins, note:t.title||'' },'area not found']
          : ['/events',{ title:t.title||areaName||'Session', start_time:t.start_time, end_time:endTime.toISOString(), category_id:t.category_id||null },'category not found'];
        try {
          let saved;
          try {
            saved = await api(path,{method:'POST',body:JSON.stringify(body)});
          } catch(ex) {
            // The area was deleted while the timer ran: log the session uncategorized
            // (what deleting an area does to its existing time) rather than leave it
            // unloggable, with Discard as the only way out.
            if(!body.category_id || ex.message!==notFound) throw ex;
            saved = await api(path,{method:'POST',body:JSON.stringify({...body,category_id:null})});
          }
          // api() resolves undefined on a 401 while it reloads to the login page — that's
          // not a save, so keep the stored timer to Stop again after signing back in.
          if(!saved){ restore(); return; }
          setRunning(getTimer(uid)); // null, or a timer started elsewhere meanwhile
          onLogged&&onLogged();
        } catch(ex) {
          restore();
          alert('Could not log session: '+ex.message);
        } finally { setBusy(false); }
      }

      const runArea    = running && categories.find(c=>c.id===running.category_id);
      const elapsedSec = running ? Math.max(0, Math.round((now - new Date(running.start_time))/1000)) : 0;

      return (
        <div style={{position:'relative'}}>
          {!running && (
            <button onClick={()=>{ if(!picking) loadCategories(); setPicking(p=>!p); }} style={{...S.btnOut,padding:'5px 12px',fontSize:13}}>
              <span style={{marginRight:5}}>▶</span>Start timer
            </button>
          )}
          {running && (
            <div style={{display:'flex',alignItems:'center',gap:6,background:'var(--bg-subtle)',border:'1px solid var(--border)',borderRadius:8,padding:'4px 6px 4px 10px'}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:runArea?areaColor(runArea):'#ef4444',flexShrink:0}}/>
              <span style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:600,minWidth:50}} title={running.title||undefined}>{fmtClock(elapsedSec)}</span>
              <button onClick={stop} disabled={busy} style={{...S.btnPri,padding:'4px 10px',fontSize:12}}>{busy?'Stopping…':'Stop'}</button>
              <button onClick={discard} disabled={busy} title="Discard without logging" style={{...S.iconBtn,color:'#dc2626',padding:'2px 6px'}}>×</button>
            </div>
          )}
          {picking && !running && (
            <div style={{position:'absolute',top:'calc(100% + 6px)',left:0,width:260,background:'#fff',border:'1px solid var(--border)',borderRadius:10,boxShadow:'0 8px 24px rgba(0,0,0,0.12)',zIndex:300,padding:14}}>
              <form onSubmit={start}>
                <div style={{marginBottom:10}}>
                  <label style={S.label}>Area</label>
                  <select style={S.input} value={form.category_id} onChange={e=>setForm(f=>({...f,category_id:e.target.value}))} autoFocus>
                    <option value="">No area</option>
                    {areaOptions(categories,groups)}
                  </select>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={S.label}>Activity</label>
                  <input style={S.input} value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="What are you working on? (optional)"/>
                </div>
                <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                  <button type="button" onClick={()=>setPicking(false)} style={S.btnOut}>Cancel</button>
                  <button type="submit" style={S.btnPri}>Start</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // LOG VIEW — traces by day, and a ledger of events + traces
    // ─────────────────────────────────────────────
    // Traces render hatched, next to events' solid fills, wherever the two are summed.
    const hatch = c => `repeating-linear-gradient(135deg, ${c} 0 2px, #fff 2px 4px)`;
    const dayDate = k => new Date(`${k}T12:00:00`); // 'YYYY-MM-DD' → that local day (noon, clear of DST edges)

    function useNarrow(query='(max-width: 640px)') {
      const [narrow,setNarrow]=React.useState(()=>window.matchMedia(query).matches);
      React.useEffect(()=>{
        const mq=window.matchMedia(query), f=e=>setNarrow(e.matches);
        mq.addEventListener('change',f); return ()=>mq.removeEventListener('change',f);
      },[query]);
      return narrow;
    }

    // "5", "5m", "1h", "1h10", "1h10m", "1.5h" → minutes (0 when w isn't a duration).
    function parseDuration(w) {
      let m;
      if((m=w.match(/^(\d+)(?:m|min|mins)?$/i))) return +m[1];
      if((m=w.match(/^(\d+)h(?:(\d+)(?:m|min|mins)?)?$/i))) return (+m[1])*60+(+(m[2]||0));
      if((m=w.match(/^(\d*\.\d+)h$/i))) return Math.round(parseFloat(m[1])*60);
      return 0;
    }
    // Quick add: "15m fr podcast on the walk" → 15 minutes of the Area coded FR, noted
    // "podcast on the walk". The Area is looked up by code, then name, then by a prefix
    // of either that only one Area has; names may be CJK with no word breaks (法文).
    // Only words before the note can name the Area, so a note word never steals it.
    function parseQuickAdd(text, areas) {
      let minutes=0, area=null; const rest=[];
      const findArea=w=>{
        const lw=w.toLowerCase(), code=a=>(a.code||'').toLowerCase();
        const exact=areas.find(a=>code(a)===lw)||areas.find(a=>a.name.toLowerCase()===lw);
        if(exact) return exact;
        if(/^[a-z]$/.test(lw)) return null; // one Latin letter is too little to go on
        const hits=areas.filter(a=>a.name.toLowerCase().startsWith(lw)||code(a).startsWith(lw));
        return hits.length===1?hits[0]:null;
      };
      text.trim().split(/\s+/).filter(Boolean).forEach(w=>{
        if(!minutes){ const m=parseDuration(w); if(m>0){ minutes=m; return; } }
        if(!area && !rest.length){ const a=findArea(w); if(a){ area=a; return; } }
        rest.push(w);
      });
      return { minutes, area, note:rest.join(' ') };
    }

    // Area marker: its code badge, or a dot when it has no code (or for "No area").
    // Next to the name, a code that is the whole name (法文) would only repeat it, so
    // it's a dot there too; `alone` keeps the badge where the name isn't shown.
    function AreaMark({ area, size=10, alone=false }) {
      const repeats=area?.code&&area.code===area.name.trim().toUpperCase();
      return area?.code && (alone||!repeats)
        ? <AreaBadge area={area} size={size}/>
        : <span style={{width:size,height:size,borderRadius:'50%',background:areaColor(area),flexShrink:0,display:'inline-block'}}/>;
    }

    const plusBtn = { flex:1, minWidth:44, height:44, border:'1px solid var(--border)', background:'var(--bg-subtle)', borderRadius:8,
      fontFamily:'var(--font-mono)', fontSize:14, fontWeight:600, color:'var(--text)', cursor:'pointer' };

    function LogView({ user, onLogout, nav }) {
      const narrow=useNarrow();
      const [tab,setTab]=React.useState('day');
      const [day,setDay]=React.useState(()=>nav.logDay||ymd(new Date()));
      const [areas,setAreas]=React.useState([]);
      const [groups,setGroups]=React.useState([]);
      const [err,setErr]=React.useState('');
      const [toast,setToast]=React.useState(null); // { text, id } of the trace just added
      const [newArea,setNewArea]=React.useState(false);
      const [version,setVersion]=React.useState(0); // bumped when traces change, so tabs reload
      const bump=()=>setVersion(v=>v+1);

      async function loadAreas() {
        try { const gs=await api('/category-groups')||[]; setGroups(gs); setAreas(resolveAreas(await api('/categories')||[],gs)); }
        catch(ex){ setErr(ex.message); }
      }
      React.useEffect(()=>{ loadAreas(); },[]);
      React.useEffect(()=>{ if(!toast) return; const id=setTimeout(()=>setToast(null),5000); return ()=>clearTimeout(id); },[toast]);

      // Adds a trace ({category_id, day, minutes, note}), for the tiles, quick add and ledger.
      async function addTrace(body) {
        setErr('');
        try {
          const t=await api('/traces',{method:'POST',body:JSON.stringify(body)});
          if(!t) return null;
          const a=areas.find(x=>x.id===t.category_id);
          setToast({ text:`+${fmtMins(t.minutes)} ${a?(a.code||a.name):'No area'}`, id:t.id });
          bump();
          return t;
        } catch(ex){ setErr(ex.message); return null; }
      }
      async function undo() {
        const t=toast; setToast(null); if(!t) return;
        try { await api(`/traces/${t.id}`,{method:'DELETE'}); }
        catch(ex){ if(ex.message!=='not found') setErr(ex.message); }
        bump();
      }

      return (
        <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
          <TopBar title="Time Log" workspace={nav.workspace} onWorkspace={nav.setWorkspace} user={user} onLogout={onLogout}>
            <TimerChip user={user} onLogged={bump}/>
          </TopBar>
          <div style={{flex:1,overflow:'auto',background:'var(--bg-subtle)'}}>
            <div style={{maxWidth:1180,margin:'0 auto',padding:narrow?'16px 16px 80px':'24px 24px 80px'}}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
                <div style={{display:'flex',background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:2,gap:1}}>
                  {[['day','Day'],['week','Ledger']].map(([k,label])=>(
                    <button key={k} onClick={()=>setTab(k)} style={{
                      padding:'6px 14px',borderRadius:6,border:'none',cursor:'pointer',fontSize:13,fontWeight:500,
                      background:tab===k?'var(--accent)':'transparent',color:tab===k?'#fff':'var(--text-muted)'}}>{label}</button>
                  ))}
                </div>
                {err&&<div style={{color:'#dc2626',fontSize:13}}>{err}</div>}
              </div>
              {tab==='day'
                ? <DayLog day={day} setDay={setDay} areas={areas} groups={groups} version={version} bump={bump}
                    addTrace={addTrace} onError={setErr} narrow={narrow} onNewArea={()=>setNewArea(true)}
                    onCalendar={()=>nav.setWorkspace('calendar')}/>
                : <TraceLedger user={user} areas={areas} groups={groups} version={version} addTrace={addTrace} onError={setErr}/>}
            </div>
          </div>
          {toast&&(
            <div role="status" style={{position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:24,zIndex:500,width:'min(420px, calc(100vw - 32px))',boxSizing:'border-box',
              background:'#111827',color:'#fff',borderRadius:12,padding:'0 8px 0 16px',height:52,display:'flex',alignItems:'center',gap:10,boxShadow:'0 10px 30px rgba(17,24,39,0.25)'}}>
              <span style={{flex:1,fontSize:14}}>Added <strong style={{fontFamily:'var(--font-mono)'}}>{toast.text}</strong></span>
              <button type="button" onClick={undo} style={{height:40,padding:'0 14px',background:'transparent',border:'none',color:'#a5b4fc',fontSize:14,fontWeight:700,cursor:'pointer'}}>Undo</button>
            </div>
          )}
          {newArea&&<AreaModal groups={groups} onClose={()=>setNewArea(false)}
            onSaved={cat=>{ setAreas(as=>resolveAreas([...as,cat],groups)); setNewArea(false); }}/>}
        </div>
      );
    }

    // One day's traces: quick add, a tile per Area, the day's trail, and the week so far.
    function DayLog({ day, setDay, areas, groups, version, bump, addTrace, onError, narrow, onNewArea, onCalendar }) {
      const [traces,setTraces]=React.useState([]);
      const [week,setWeek]=React.useState(null);
      const [draft,setDraft]=React.useState('');
      const [editing,setEditing]=React.useState(null); // { id, minutes, category_id, note }
      const today=ymd(new Date());

      React.useEffect(()=>{
        let live=true;
        (async()=>{
          try {
            // The week holding the day, counted up to now.
            const from=startOfWeek(dayDate(day)), now=new Date();
            const end=addDays(from,7), to=end>now?now:end;
            const [ts,st]=await Promise.all([api(tracesUrl(day,day)), from<to?fetchStats(from,to):null]);
            if(live){ setTraces(ts||[]); setWeek(st); }
          } catch(ex){ if(live) onError(ex.message); }
        })();
        return ()=>{ live=false; };
      },[day,version]);

      const ordered=React.useMemo(()=>groupAreas(areas,groups).flatMap(s=>s.areas),[areas,groups]);
      const byId=React.useMemo(()=>Object.fromEntries(areas.map(a=>[a.id,a])),[areas]);
      const dayMins=React.useMemo(()=>{ const m={}; traces.forEach(t=>{ const k=t.category_id||'none'; m[k]=(m[k]||0)+t.minutes; }); return m; },[traces]);
      const total=traces.reduce((n,t)=>n+t.minutes,0);
      const parsed=parseQuickAdd(draft,areas);
      const canAdd=parsed.minutes>0&&parsed.minutes<=1440;

      async function quickAdd(e) {
        e.preventDefault();
        if(!canAdd) return;
        const t=await addTrace({ category_id:parsed.area?.id||null, day, minutes:parsed.minutes, note:parsed.note });
        if(t) setDraft('');
      }
      async function saveEdit(e) {
        e.preventDefault();
        const mins=parseInt(editing.minutes,10);
        if(!(mins>=1&&mins<=1440)){ onError('Minutes must be between 1 and 1440'); return; }
        try {
          await api(`/traces/${editing.id}`,{method:'PUT',body:JSON.stringify({ minutes:mins, category_id:editing.category_id||null, note:editing.note.trim() })});
          setEditing(null); onError(''); bump();
        } catch(ex){ onError(ex.message); }
      }
      async function del(id) {
        if(!confirm('Delete this trace?')) return;
        try { await api(`/traces/${id}`,{method:'DELETE'}); if(editing?.id===id) setEditing(null); bump(); }
        catch(ex){ onError(ex.message); }
      }

      const label = day===today ? 'Today' : day===ymd(addDays(new Date(),-1)) ? 'Yesterday' : dayDate(day).toLocaleDateString([],{weekday:'long'});
      const card = { background:'#fff', border:'1px solid var(--border)', borderRadius:12 };

      // This week's bars: Areas with time or a target, events solid and traces hatched.
      const weekRows=React.useMemo(()=>{
        const stats=week?.areas||[], byArea=Object.fromEntries(stats.map(s=>[s.area_id||'none',s]));
        const rows=ordered.map(a=>({ area:a, s:byArea[a.id] })).filter(r=>r.s||(r.area.weekly_target_minutes||0)>0);
        // No-area traces only: the stats' Uncategorized also counts events with no Area,
        // which are appointments, not tracked time (as in the Ledger).
        const none=byArea.none&&{...byArea.none,event_minutes:0,total_minutes:byArea.none.trace_minutes||0};
        if(none?.total_minutes) rows.push({ area:null, s:none });
        const maxTotal=Math.max(1,...rows.map(r=>r.s?.total_minutes||0));
        return rows.map(({area,s})=>{
          const ev=s?.event_minutes||0, tr=s?.trace_minutes||0, tgt=area?.weekly_target_minutes||0;
          const scale=tgt>0?Math.max(tgt,ev+tr):maxTotal;
          return { area, ev, tr, tgt, evPct:ev/scale*100, trPct:tr/scale*100 };
        });
      },[week,ordered]);

      return (
        <div style={{display:'flex',gap:24,alignItems:'flex-start',flexDirection:narrow?'column':'row'}}>
          <div style={{flex:1,minWidth:0,width:'100%',display:'flex',flexDirection:'column',gap:16}}>
            <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:12}}>
              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                <button type="button" aria-label="Previous day" onClick={()=>setDay(ymd(addDays(dayDate(day),-1)))} style={{...S.btnOut,padding:'6px 12px'}}>‹</button>
                <button type="button" aria-label="Next day" disabled={day>=today} onClick={()=>setDay(ymd(addDays(dayDate(day),1)))} style={{...S.btnOut,padding:'6px 12px',opacity:day>=today?0.4:1}}>›</button>
                <div style={{fontSize:22,fontWeight:700,marginLeft:6}}>{label}</div>
                <div style={{fontSize:14,color:'var(--text-muted)'}}>{dayDate(day).toLocaleDateString([],{month:'short',day:'numeric',year:day.slice(0,4)===today.slice(0,4)?undefined:'numeric'})}</div>
                {day!==today&&<button type="button" onClick={()=>setDay(today)} style={{...S.iconBtn,fontSize:13,color:'var(--accent)',fontWeight:600}}>Today</button>}
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                <div style={{fontSize:11,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.04em',fontWeight:500}}>Traced</div>
                <div style={{fontFamily:'var(--font-mono)',fontSize:24,fontWeight:600}}>{fmtMins(total)}</div>
              </div>
            </div>

            <form onSubmit={quickAdd} style={{...card,padding:'14px 16px'}}>
              <label htmlFor="quick-add" style={S.label}>Quick add</label>
              <div style={{display:'flex',gap:8}}>
                <input id="quick-add" style={{...S.input,height:44,fontFamily:'var(--font-mono)',fontSize:15}} value={draft} onChange={e=>setDraft(e.target.value)}
                  placeholder="15m fr podcast on the walk" autoComplete="off"/>
                <button type="submit" disabled={!canAdd} style={{...S.btnPri,height:44,opacity:canAdd?1:0.5}}>Add</button>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:6,marginTop:8,minHeight:22,fontSize:13,color:'var(--text-muted)',flexWrap:'wrap'}}>
                {canAdd ? <>
                  <span>Will add</span>
                  <strong style={{fontFamily:'var(--font-mono)',color:'var(--text)'}}>{fmtMins(parsed.minutes)}</strong>
                  <span>to</span>
                  <span style={{display:'inline-flex',alignItems:'center',gap:5,color:'var(--text)',fontWeight:500}}><AreaMark area={parsed.area}/>{parsed.area?parsed.area.name:'No area'}</span>
                  {parsed.note&&<span>· “{parsed.note}”</span>}
                </> : <span>A duration (5m, 1h10), then an area code or name; the rest becomes a note. Enter adds.</span>}
              </div>
            </form>

            <div style={narrow
              ? {...card,display:'flex',flexDirection:'column'}
              : {display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(230px,1fr))',gap:12}}>
              {ordered.map((a,i)=>{
                const m=dayMins[a.id]||0;
                const add=n=>addTrace({ category_id:a.id, day, minutes:n, note:'' });
                return narrow ? (
                  <div key={a.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderTop:i?'1px solid var(--border)':'none'}}>
                    <AreaMark area={a} size={12}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:15,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.name}</div>
                      <div style={{fontSize:12,color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{fmtMins(m)}</div>
                    </div>
                    <button type="button" aria-label={`Add 5 minutes to ${a.name}`} onClick={()=>add(5)} style={{...plusBtn,flex:'none',width:52}}>+5</button>
                    <button type="button" aria-label={`Add 15 minutes to ${a.name}`} onClick={()=>add(15)} style={{...plusBtn,flex:'none',width:52}}>+15</button>
                  </div>
                ) : (
                  <div key={a.id} style={{...card,padding:14,display:'flex',flexDirection:'column',gap:12}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <AreaMark area={a} size={11}/>
                      <span style={{fontSize:14,fontWeight:600,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.name}</span>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:15,fontWeight:600,color:m?'var(--text)':'#9ca3af'}}>{fmtMins(m)}</span>
                    </div>
                    <div style={{display:'flex',gap:6}}>
                      {[5,15,30].map(n=>(
                        <button key={n} type="button" aria-label={`Add ${n} minutes to ${a.name}`} onClick={()=>add(n)} style={plusBtn}>+{n}</button>
                      ))}
                    </div>
                  </div>
                );
              })}
              {ordered.length===0&&(
                <div style={{...card,padding:16,fontSize:14,color:'var(--text-muted)'}}>
                  No areas yet. <button type="button" onClick={onNewArea} style={{...S.iconBtn,display:'inline',padding:0,fontSize:14,color:'var(--accent)',fontWeight:600}}>Create one</button> to trace time against it.
                </div>
              )}
            </div>

            <div style={card}>
              <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:8,padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
                <div style={{fontSize:13,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.04em'}}>Trail</div>
                <div style={{fontSize:12,color:'var(--text-muted)'}}>times are when you noted it</div>
              </div>
              {traces.length===0&&<div style={{padding:'16px',fontSize:14,color:'var(--text-muted)'}}>Nothing traced on this day.</div>}
              {traces.map((t,i)=>{
                const a=byId[t.category_id]||null;
                if(editing?.id===t.id) return (
                  <form key={t.id} onSubmit={saveEdit} style={{display:'flex',gap:8,alignItems:'center',padding:'8px 12px',borderTop:i?'1px solid var(--border)':'none',flexWrap:'wrap',background:'var(--accent-light)'}}>
                    <input aria-label="Minutes" type="number" min="1" max="1440" value={editing.minutes} onChange={e=>setEditing(x=>({...x,minutes:e.target.value}))} style={{...S.input,width:80}} autoFocus/>
                    <select aria-label="Area" value={editing.category_id} onChange={e=>setEditing(x=>({...x,category_id:e.target.value}))} style={{...S.input,width:'auto',flex:'1 1 140px'}}>
                      <option value="">No area</option>
                      {areaOptions(areas,groups)}
                    </select>
                    <input aria-label="Note" value={editing.note} onChange={e=>setEditing(x=>({...x,note:e.target.value}))} placeholder="note" style={{...S.input,flex:'2 1 160px',width:'auto'}}/>
                    <button type="button" onClick={()=>setEditing(null)} style={S.btnOut}>Cancel</button>
                    <button type="submit" style={S.btnPri}>Save</button>
                  </form>
                );
                return (
                  <div key={t.id} style={{display:'flex',alignItems:'center',gap:4,padding:'2px 8px 2px 4px',borderTop:i?'1px solid var(--border)':'none'}}>
                    <button type="button" title="Edit" onClick={()=>setEditing({ id:t.id, minutes:String(t.minutes), category_id:t.category_id||'', note:t.note||'' })}
                      style={{flex:1,minWidth:0,display:'flex',alignItems:'center',gap:12,padding:'8px',background:'none',border:'none',cursor:'pointer',textAlign:'left',color:'var(--text)',fontSize:13}}>
                      <span style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)',width:40,flexShrink:0}}>{hhmm(new Date(t.created_at))}</span>
                      <AreaMark area={a} alone={!!t.note}/>
                      <span style={{fontFamily:'var(--font-mono)',fontWeight:600,width:52,flexShrink:0}}>{fmtMins(t.minutes)}</span>
                      <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:t.note?'var(--text)':'#9ca3af'}}>{t.note||(a?a.name:'No area')}</span>
                    </button>
                    <button type="button" aria-label="Delete trace" onClick={()=>del(t.id)} style={{...S.iconBtn,color:'#9ca3af',width:36,height:36,justifyContent:'center'}}>×</button>
                  </div>
                );
              })}
            </div>
          </div>

          <aside style={{width:narrow?'100%':320,flexShrink:0,display:'flex',flexDirection:'column',gap:16}}>
            <div style={{...card,padding:16}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
                <div style={{fontSize:14,fontWeight:600}}>This week</div>
                <div style={{fontSize:12,color:'var(--text-muted)'}}>from {startOfWeek(dayDate(day)).toLocaleDateString([],{month:'short',day:'numeric'})}</div>
              </div>
              <div style={{display:'flex',gap:12,fontSize:11,color:'var(--text-muted)',marginBottom:14,flexWrap:'wrap'}}>
                <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:14,height:8,borderRadius:2,background:'#6b7280'}}/>Events</span>
                <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:14,height:8,borderRadius:2,background:hatch('#6b7280')}}/>Traces</span>
                <span>Full bar = target</span>
              </div>
              {weekRows.length===0&&<div style={{fontSize:13,color:'var(--text-muted)'}}>Nothing tracked yet this week.</div>}
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {weekRows.map(r=>{
                  const c=areaColor(r.area);
                  return (
                    <div key={r.area?.id||'none'}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                        <AreaMark area={r.area}/>
                        <span style={{fontSize:13,fontWeight:500,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.area?r.area.name:'No area'}</span>
                        <span style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)'}}>{fmtMins(r.ev+r.tr)}{r.tgt?` / ${fmtMins(r.tgt)}`:''}</span>
                      </div>
                      <div style={{display:'flex',height:8,borderRadius:4,background:'#f3f4f6',overflow:'hidden'}}>
                        <div style={{width:`${r.evPct}%`,background:c}} title={`Events ${fmtMins(r.ev)}`}/>
                        <div style={{width:`${r.trPct}%`,background:hatch(c)}} title={`Traces ${fmtMins(r.tr)}`}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={{...card,padding:16,fontSize:13,color:'#374151',display:'flex',flexDirection:'column',gap:8}}>
              <div style={{fontSize:14,fontWeight:600,color:'var(--text)'}}>Did something longer?</div>
              <div>Anything with a real start time belongs on the calendar.</div>
              <button type="button" onClick={onCalendar} style={{...S.iconBtn,padding:0,fontSize:13,fontWeight:600,color:'var(--accent)'}}>Put a session on the calendar →</button>
            </div>
          </aside>
        </div>
      );
    }

    // Areas × days, summing categorized events (solid) and traces (hatched). Counts
    // what has started by now, like the stats; an event counts on the day it starts.
    const LEDGER_MAX_DAYS = 62; // day columns the Ledger shows at most
    function TraceLedger({ user, areas, groups, version, addTrace, onError }) {
      const [range,setRange]=React.useState('week'); // week|lastweek|month|custom
      const [customFrom,setCustomFrom]=React.useState(ymd(startOfWeek(new Date())));
      const [customTo,setCustomTo]=React.useState(ymd(new Date()));
      const [events,setEvents]=React.useState([]);
      const [traces,setTraces]=React.useState([]);
      const [open,setOpen]=React.useState(null); // { id:`${rowKey}|${day}`, top, left } of the open cell's popover

      const period=React.useMemo(()=>{
        const now=new Date();
        if(range==='lastweek'){ const s=addDays(startOfWeek(now),-7); return {from:s,to:addDays(s,7),targets:true}; }
        if(range==='month'){ return {from:startOfMonth(now),to:new Date(now.getFullYear(),now.getMonth()+1,1),targets:false}; }
        if(range==='custom'){ const f=dayDate(customFrom), t=dayDate(customTo); f.setHours(0,0,0,0); t.setHours(0,0,0,0);
          const end=addDays(t<f?f:t,1), cap=addDays(f,LEDGER_MAX_DAYS);
          return {from:f,to:end>cap?cap:end,targets:false,capped:end>cap}; }
        const r=weekRange(now); return {from:r.from,to:r.to,targets:true};
      },[range,customFrom,customTo]);
      const days=React.useMemo(()=>{
        const out=[]; for(let d=new Date(period.from); d<period.to; d=addDays(d,1)) out.push(ymd(d));
        return out;
      },[period]);

      React.useEffect(()=>{
        let live=true;
        (async()=>{
          try {
            const now=new Date(), to=period.to>now?now:period.to;
            const [evs,ts]=await Promise.all([
              period.from<to?api(`/events?from=${encodeURIComponent(period.from.toISOString())}&to=${encodeURIComponent(to.toISOString())}`):[],
              api(tracesUrl(days[0],days[days.length-1])),
            ]);
            if(live){ setEvents(evs||[]); setTraces(ts||[]); }
          } catch(ex){ if(live) onError(ex.message); }
        })();
        return ()=>{ live=false; };
      },[period,days,version]);

      const today=ymd(new Date());
      const { rows, dayTotals, grand }=React.useMemo(()=>{
        const mine=new Set(areas.map(a=>a.id)), now=Date.now();
        const cell={}; // rowKey → day → { ev:[], tr:[], evMin, trMin }
        const at=(k,d)=>{ cell[k]=cell[k]||{}; return cell[k][d]=cell[k][d]||{ ev:[], tr:[], evMin:0, trMin:0 }; };
        // Only your own categorized, timed events: an event with no Area is an
        // appointment, not tracked time, and a shared calendar's aren't yours.
        events.forEach(e=>{
          if(e.all_day||!mine.has(e.category_id)||(e.owner_id&&e.owner_id!==user.id)) return;
          if(new Date(e.start_time).getTime()>now) return;
          const c=at(e.category_id,ymd(new Date(e.start_time)));
          c.ev.push(e); c.evMin+=Math.max(0,Math.round((new Date(e.end_time)-new Date(e.start_time))/60000));
        });
        traces.forEach(t=>{ const c=at(mine.has(t.category_id)?t.category_id:'none',t.day); c.tr.push(t); c.trMin+=t.minutes; });
        const ordered=groupAreas(areas,groups).flatMap(s=>s.areas);
        const list=ordered.filter(a=>cell[a.id]||(period.targets&&a.weekly_target_minutes>0)).map(a=>({ key:a.id, area:a }));
        if(cell.none) list.push({ key:'none', area:null });
        const dayTotals={}; let grand=0;
        const rows=list.map(r=>{
          let ev=0,tr=0;
          days.forEach(d=>{ const c=cell[r.key]?.[d]; if(c){ ev+=c.evMin; tr+=c.trMin; dayTotals[d]=(dayTotals[d]||0)+c.evMin+c.trMin; } });
          grand+=ev+tr;
          return { ...r, cells:cell[r.key]||{}, ev, tr, tgt:period.targets?(r.area?.weekly_target_minutes||0):0 };
        });
        return { rows, dayTotals, grand };
      },[events,traces,areas,groups,days,period,user]);

      const cellMax=Math.max(60,...rows.flatMap(r=>days.map(d=>{ const c=r.cells[d]; return c?c.evMin+c.trMin:0; })));
      const cols=`minmax(140px,180px) repeat(${days.length}, minmax(58px,1fr)) 128px`;
      const head={fontSize:11,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.04em'};

      return (
        <div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}}>
            <div style={{display:'flex',background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:2,gap:1}}>
              {[['week','This week'],['lastweek','Last week'],['month','This month'],['custom','Custom']].map(([k,label])=>(
                <button key={k} onClick={()=>setRange(k)} style={{
                  padding:'5px 12px',borderRadius:6,border:'none',cursor:'pointer',fontSize:13,fontWeight:500,
                  background:range===k?'var(--accent)':'transparent',color:range===k?'#fff':'var(--text-muted)'}}>{label}</button>
              ))}
            </div>
            {range==='custom'&&(
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <input type="date" aria-label="From" style={{...S.input,width:'auto',padding:'6px 8px'}} value={customFrom} max={customTo} onChange={e=>setCustomFrom(e.target.value)}/>
                <span style={{color:'var(--text-muted)',fontSize:13}}>→</span>
                <input type="date" aria-label="To" style={{...S.input,width:'auto',padding:'6px 8px'}} value={customTo} min={customFrom} onChange={e=>setCustomTo(e.target.value)}/>
                {period.capped&&<span style={{fontSize:12,color:'var(--text-muted)'}}>Showing the first {LEDGER_MAX_DAYS} days</span>}
              </div>
            )}
            <div style={{display:'flex',gap:12,fontSize:12,color:'var(--text-muted)',marginLeft:'auto'}}>
              <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:14,height:8,borderRadius:2,background:'#6b7280'}}/>Events</span>
              <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:14,height:8,borderRadius:2,background:hatch('#6b7280')}}/>Traces</span>
            </div>
          </div>

          <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:12,overflowX:'auto'}}>
            <div style={{minWidth:'fit-content'}}>
              <div style={{display:'grid',gridTemplateColumns:cols,borderBottom:'1px solid var(--border)'}}>
                <div style={{...head,padding:'10px 14px'}}>Area</div>
                {days.map(d=>(
                  <div key={d} style={{...head,padding:'10px 4px',textAlign:'center',color:d===today?'var(--accent)':d>today?'#9ca3af':head.color,background:d===today?'var(--accent-light)':'transparent'}}>
                    {dayDate(d).toLocaleDateString([],{weekday:'short'})} {dayDate(d).getDate()}
                  </div>
                ))}
                <div style={{...head,padding:'10px 14px',textAlign:'right'}}>{period.targets?'Total / target':'Total'}</div>
              </div>
              {rows.length===0&&<div style={{padding:16,fontSize:14,color:'var(--text-muted)'}}>Nothing tracked in this range.</div>}
              {rows.map(r=>{
                const c=areaColor(r.area), scale=r.tgt>0?Math.max(r.tgt,r.ev+r.tr):Math.max(1,grand);
                return (
                  <div key={r.key} style={{display:'grid',gridTemplateColumns:cols,borderBottom:'1px solid #f3f4f6',minHeight:56}}>
                    <div style={{padding:'0 14px',display:'flex',alignItems:'center',gap:8,minWidth:0}}>
                      <AreaMark area={r.area}/>
                      <span style={{fontSize:14,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.area?r.area.name:'No area'}</span>
                    </div>
                    {days.map(d=>{
                      const x=r.cells[d], sum=x?x.evMin+x.trMin:0, id=`${r.key}|${d}`, future=d>today;
                      return (
                        <div key={d} style={{background:d===today?'#f5f7ff':future?'#fcfcfd':'#fff',boxShadow:open?.id===id?'inset 0 0 0 2px var(--accent)':'none'}}>
                          <button type="button" disabled={future} onClick={e=>{
                              // Fixed to the viewport: the table's sideways scroll would clip it.
                              const b=e.currentTarget.getBoundingClientRect(), w=270;
                              setOpen(o=>o?.id===id?null:{ id, top:b.bottom+4, left:Math.max(8,Math.min(b.left,window.innerWidth-w-8)) });
                            }} aria-label={`${r.area?r.area.name:'No area'}, ${d}`}
                            style={{width:'100%',height:'100%',minHeight:56,padding:'8px 6px',border:'none',background:'transparent',cursor:future?'default':'pointer',display:'flex',flexDirection:'column',justifyContent:'center',gap:5}}>
                            <span style={{fontFamily:'var(--font-mono)',fontSize:13,textAlign:'center',color:sum?'var(--text)':'#d1d5db'}}>{future?'':sum?fmtMins(sum):'·'}</span>
                            {!future&&<span style={{display:'flex',height:4,borderRadius:2,background:'#f3f4f6',overflow:'hidden'}}>
                              <span style={{width:`${(x?.evMin||0)/cellMax*100}%`,background:c}}/>
                              <span style={{width:`${(x?.trMin||0)/cellMax*100}%`,background:hatch(c)}}/>
                            </span>}
                          </button>
                          {open?.id===id&&(
                            <>
                              <div onClick={()=>setOpen(null)} style={{position:'fixed',inset:0,zIndex:40}}/>
                              <div style={{position:'fixed',top:open.top,left:open.left,zIndex:41,width:270,maxHeight:`calc(100vh - ${open.top+8}px)`,overflowY:'auto',boxSizing:'border-box',background:'#fff',border:'1px solid var(--border)',borderRadius:10,boxShadow:'0 12px 32px rgba(17,24,39,0.14)',padding:'12px 14px',fontSize:13,display:'flex',flexDirection:'column',gap:6}}>
                                <div style={{display:'flex',justifyContent:'space-between',fontWeight:600}}>
                                  <span>{r.area?r.area.name:'No area'} · {dayDate(d).toLocaleDateString([],{weekday:'short',day:'numeric'})}</span>
                                  <span style={{fontFamily:'var(--font-mono)'}}>{fmtMins(sum)}</span>
                                </div>
                                {x?.ev.length>0&&<div style={{...head,marginTop:4}}>Events</div>}
                                {x?.ev.map(e=>(
                                  <div key={e.id} style={{display:'flex',gap:8}}>
                                    <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.title} <span style={{color:'var(--text-muted)'}}>{hhmm(new Date(e.start_time))}–{hhmm(new Date(e.end_time))}</span></span>
                                    <span style={{fontFamily:'var(--font-mono)'}}>{fmtMins((new Date(e.end_time)-new Date(e.start_time))/60000)}</span>
                                  </div>
                                ))}
                                {x?.tr.length>0&&<div style={{...head,marginTop:4}}>Traces</div>}
                                {x?.tr.map(t=>(
                                  <div key={t.id} style={{display:'flex',gap:8}}>
                                    <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:t.note?'var(--text)':'#9ca3af'}}>{t.note||'no note'}</span>
                                    <span style={{fontFamily:'var(--font-mono)'}}>{fmtMins(t.minutes)}</span>
                                  </div>
                                ))}
                                <div style={{display:'flex',gap:6,paddingTop:8,marginTop:2,borderTop:'1px solid #f3f4f6'}}>
                                  {[5,15,30].map(n=>(
                                    <button key={n} type="button" aria-label={`Add ${n} minutes`} onClick={()=>addTrace({ category_id:r.area?.id||null, day:d, minutes:n, note:'' })} style={{...plusBtn,height:36}}>+{n}</button>
                                  ))}
                                </div>
                              </div>
                            </>
                          )}
                        </div>
                      );
                    })}
                    <div style={{padding:'0 14px',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'flex-end',gap:5}}>
                      <div style={{fontFamily:'var(--font-mono)',fontSize:13,fontWeight:600}}>{fmtMins(r.ev+r.tr)}{r.tgt>0&&<span style={{color:'#9ca3af',fontWeight:400}}> / {fmtMins(r.tgt)}</span>}</div>
                      <div style={{width:100,display:'flex',height:4,borderRadius:2,background:'#f3f4f6',overflow:'hidden'}}>
                        <div style={{width:`${r.ev/scale*100}%`,background:c}}/>
                        <div style={{width:`${r.tr/scale*100}%`,background:hatch(c)}}/>
                      </div>
                    </div>
                  </div>
                );
              })}
              {rows.length>0&&(
                <div style={{display:'grid',gridTemplateColumns:cols,minHeight:44,alignItems:'center',fontFamily:'var(--font-mono)',fontSize:13,fontWeight:600}}>
                  <div style={{...head,padding:'0 14px',fontFamily:'inherit'}}>Day total</div>
                  {days.map(d=><div key={d} style={{textAlign:'center',color:d===today?'var(--accent)':'var(--text)'}}>{d>today?'':fmtMins(dayTotals[d]||0)}</div>)}
                  <div style={{padding:'0 14px',textAlign:'right'}}>{fmtMins(grand)}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // AREAS VIEW — goals + tasks per area
    // ─────────────────────────────────────────────
    function TaskRow({ task, onToggle, onDel }) {
      return (
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0'}}>
          <span onClick={()=>onToggle(task)} style={{
            width:16,height:16,borderRadius:4,border:`2px solid ${task.done?'var(--accent)':'var(--border)'}`,
            background:task.done?'var(--accent)':'transparent',cursor:'pointer',flexShrink:0,
            display:'flex',alignItems:'center',justifyContent:'center',
          }}>{task.done&&<span style={{color:'#fff',fontSize:10,fontWeight:700,lineHeight:1}}>✓</span>}</span>
          <span style={{flex:1,fontSize:13,color:task.done?'var(--text-muted)':'var(--text)',textDecoration:task.done?'line-through':'none'}}>{task.title}</span>
          {task.due_date&&<span style={{fontSize:11,color:'var(--text-muted)'}}>{new Date(task.due_date).toLocaleDateString([],{month:'short',day:'numeric',timeZone:'UTC'})}</span>}
          <button onClick={()=>onDel(task.id)} style={{...S.iconBtn,fontSize:14,color:'var(--text-muted)',padding:'0 4px'}} title="Delete">×</button>
        </div>
      );
    }

    function AreaCard({ area, tasks, weekMins, plannedMins=0, onToggle, onAdd, onDel, onEdit }) {
      const [newTitle,setNewTitle]=React.useState('');
      const [showDone,setShowDone]=React.useState(false);
      const open=tasks.filter(t=>!t.done);
      const done=tasks.filter(t=>t.done);
      const tgt=area.weekly_target_minutes||0;
      const donePct=tgt>0?Math.min(100,weekMins/tgt*100):0;
      const planPct=tgt>0?Math.min(100-donePct,plannedMins/tgt*100):0;
      const projected=weekMins+plannedMins;
      return (
        <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:12,padding:16,display:'flex',flexDirection:'column'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
            {area.code
              ? <AreaBadge area={area} size={11}/>
              : <span style={{width:12,height:12,borderRadius:3,background:areaColor(area),flexShrink:0}}/>}
            <div style={{fontSize:15,fontWeight:600,flex:1}}>{area.name}</div>
            {onEdit&&<button style={S.iconBtn} title="Edit area" onClick={onEdit}>✎</button>}
          </div>
          {(tgt>0||weekMins>0||plannedMins>0)&&(
            <div style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text-muted)',marginBottom:4}}>
                <span>This week</span><span style={{fontFamily:'var(--font-mono)'}}>{fmtMins(weekMins)}{tgt>0?` / ${fmtMins(tgt)}`:''}</span>
              </div>
              {tgt>0&&(
                <div style={{display:'flex',height:6,borderRadius:3,background:'var(--bg-subtle)',overflow:'hidden'}}>
                  <div style={{width:`${donePct}%`,background:areaColor(area),transition:'0.2s'}} title={`Logged ${fmtMins(weekMins)}`}/>
                  {planPct>0&&<div style={{width:`${planPct}%`,background:areaColor(area),opacity:0.4,transition:'0.2s'}} title={`Planned ${fmtMins(plannedMins)}`}/>}
                </div>
              )}
              {plannedMins>0&&(
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:5,display:'flex',alignItems:'center',gap:5}}>
                  <span style={{width:8,height:8,borderRadius:2,background:areaColor(area),opacity:0.4,flexShrink:0}}/>
                  <span>{fmtMins(plannedMins)} planned{tgt>0?(projected<tgt?` · ${fmtMins(tgt-projected)} to target`:' · on track'):''}</span>
                </div>
              )}
            </div>
          )}
          <div style={{display:'flex',flexDirection:'column',gap:2}}>
            {open.length===0&&<div style={{fontSize:13,color:'var(--text-muted)',padding:'4px 0'}}>No open tasks.</div>}
            {open.map(t=><TaskRow key={t.id} task={t} onToggle={onToggle} onDel={onDel}/>)}
          </div>
          <form onSubmit={e=>{e.preventDefault(); onAdd(area.id,newTitle); setNewTitle('');}} style={{display:'flex',gap:6,marginTop:8}}>
            <input style={{...S.input,padding:'6px 8px',fontSize:13}} value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="Add a task…"/>
            <button type="submit" style={{...S.btnOut,padding:'6px 10px'}}>Add</button>
          </form>
          {done.length>0&&(
            <div style={{marginTop:10}}>
              <button onClick={()=>setShowDone(s=>!s)} style={{...S.iconBtn,fontSize:12,color:'var(--text-muted)',padding:'2px 4px'}}>
                {showDone?'▾':'▸'} Completed ({done.length})
              </button>
              {showDone&&<div style={{display:'flex',flexDirection:'column',gap:2,marginTop:4}}>
                {done.map(t=><TaskRow key={t.id} task={t} onToggle={onToggle} onDel={onDel}/>)}
              </div>}
            </div>
          )}
        </div>
      );
    }

    function AreaModal({ area, groups=[], defaultGroupId=null, onClose, onSaved, onDeleted }) {
      const isEdit=!!area;
      const [name,setName]=React.useState(area?.name||'');
      const [color,setColor]=React.useState(area?.color||CALENDAR_COLORS[0]);
      const [groupId,setGroupId]=React.useState(area?(area.group_id||''):(defaultGroupId||''));
      const [code,setCode]=React.useState(area?.code||'');
      const group=groups.find(g=>g.id===groupId);
      const [hours,setHours]=React.useState(area?String(Math.round((area.weekly_target_minutes||0)/60*10)/10):'0');
      const [busy,setBusy]=React.useState(false);
      const [err,setErr]=React.useState('');

      async function save(e) {
        e.preventDefault(); if(!name.trim())return;
        setBusy(true); setErr('');
        try {
          const weekly=Math.round(parseFloat(hours||'0')*60);
          // Explicit null ungroups on edit. An empty code has the server derive one
          // from the name, on edit too.
          const body={ name:name.trim(), color, weekly_target_minutes:weekly, group_id:groupId||null };
          body.code=code.trim();
          const saved = isEdit
            ? await api(`/categories/${area.id}`,{method:'PUT',body:JSON.stringify(body)})
            : await api('/categories',{method:'POST',body:JSON.stringify(body)});
          onSaved(saved);
        } catch(ex){ setErr(ex.message); setBusy(false); }
      }

      async function del() {
        if(!confirm('Delete this area? Events and tasks keep their data and become uncategorized.')) return;
        setBusy(true); setErr('');
        try{ await api(`/categories/${area.id}`,{method:'DELETE'}); onDeleted&&onDeleted(area.id); }
        catch(ex){ setErr(ex.message); setBusy(false); }
      }

      return (
        <div style={S.overlay} onClick={onClose}>
          <div style={{...S.modal,width:360}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
              <h2 style={{margin:0,fontSize:18,fontWeight:700}}>{isEdit?'Edit Area':'New Area'}</h2>
              <button onClick={onClose} style={{...S.iconBtn,fontSize:22}}>×</button>
            </div>
            <form onSubmit={save}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 88px',gap:10,marginBottom:16}}>
                <div><label style={S.label}>Name</label><input style={S.input} value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. French, Fitness" autoFocus required/></div>
                <div><label style={S.label}>Code</label><input style={{...S.input,fontFamily:'var(--font-mono)',textTransform:'uppercase'}} value={code} maxLength={4} onChange={e=>setCode(e.target.value)} placeholder="auto" title="1–4 letters or digits, shown as a badge on events. Leave empty to derive one from the name."/></div>
              </div>
              {(groups.length>0||groupId)&&(
                <div style={{marginBottom:16}}>
                  <label style={S.label}>Group</label>
                  <select style={S.input} value={groupId} onChange={e=>setGroupId(e.target.value)}>
                    <option value="">No group</option>
                    {groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
                  </select>
                </div>
              )}
              <div style={{marginBottom:16}}>
                <label style={S.label}>Color</label>
                {group
                  ? <div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text-muted)',marginTop:4}}>
                      <span style={{width:16,height:16,borderRadius:'50%',background:group.color,flexShrink:0}}/>Uses the {group.name} group color
                    </div>
                  : <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
                      {CALENDAR_COLORS.map(c=>(
                        <button key={c} type="button" onClick={()=>setColor(c)} style={{width:28,height:28,borderRadius:'50%',background:c,border:color===c?'3px solid #111':'3px solid transparent',cursor:'pointer',outline:'none'}}/>
                      ))}
                    </div>}
              </div>
              <div style={{marginBottom:20}}><label style={S.label}>Weekly target (hours)</label><input style={S.input} type="number" min="0" step="0.5" value={hours} onChange={e=>setHours(e.target.value)} placeholder="0 = no target"/></div>
              {err&&<div style={{color:'#dc2626',fontSize:13,marginBottom:14}}>{err}</div>}
              <div style={{display:'flex',gap:8,justifyContent:'flex-end',flexWrap:'wrap'}}>
                {isEdit&&onDeleted&&<button type="button" onClick={del} disabled={busy} style={{...S.btnOut,color:'#dc2626',borderColor:'#fca5a5'}}>Delete</button>}
                <button type="button" onClick={onClose} style={S.btnOut}>Cancel</button>
                <button type="submit" disabled={busy} style={S.btnPri}>{busy?'Saving…':(isEdit?'Save':'Create')}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // `groups` (the existing ones) lets a new group default to an unused colour
    // and sort after the others.
    function GroupModal({ group, groups=[], onClose, onSaved, onDeleted }) {
      const isEdit=!!group;
      const [name,setName]=React.useState(group?.name||'');
      const [color,setColor]=React.useState(()=>group?.color||CALENDAR_COLORS.find(c=>!groups.some(g=>g.color===c))||CALENDAR_COLORS[0]);
      const [busy,setBusy]=React.useState(false);
      const [err,setErr]=React.useState('');

      async function save(e) {
        e.preventDefault(); if(!name.trim())return;
        setBusy(true); setErr('');
        try {
          const body={ name:name.trim(), color };
          if(!isEdit) body.position=groups.reduce((m,g)=>Math.max(m,g.position+1),0);
          const saved = isEdit
            ? await api(`/category-groups/${group.id}`,{method:'PUT',body:JSON.stringify(body)})
            : await api('/category-groups',{method:'POST',body:JSON.stringify(body)});
          onSaved(saved);
        } catch(ex){ setErr(ex.message); setBusy(false); }
      }

      async function del() {
        if(!confirm('Delete this group? Its areas are kept and become ungrouped.')) return;
        setBusy(true); setErr('');
        try{ await api(`/category-groups/${group.id}`,{method:'DELETE'}); onDeleted&&onDeleted(group.id); }
        catch(ex){ setErr(ex.message); setBusy(false); }
      }

      return (
        <div style={S.overlay} onClick={onClose}>
          <div style={{...S.modal,width:360}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
              <h2 style={{margin:0,fontSize:18,fontWeight:700}}>{isEdit?'Edit Group':'New Group'}</h2>
              <button onClick={onClose} style={{...S.iconBtn,fontSize:22}}>×</button>
            </div>
            <form onSubmit={save}>
              <div style={{marginBottom:16}}><label style={S.label}>Name</label><input style={S.input} value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Language learning, Health" autoFocus required/></div>
              <div style={{marginBottom:20}}>
                <label style={S.label}>Color</label>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
                  {CALENDAR_COLORS.map(c=>(
                    <button key={c} type="button" onClick={()=>setColor(c)} style={{width:28,height:28,borderRadius:'50%',background:c,border:color===c?'3px solid #111':'3px solid transparent',cursor:'pointer',outline:'none'}}/>
                  ))}
                </div>
                <div style={{fontSize:12,color:'var(--text-muted)',marginTop:6}}>Every area in the group uses this color.</div>
              </div>
              {err&&<div style={{color:'#dc2626',fontSize:13,marginBottom:14}}>{err}</div>}
              <div style={{display:'flex',gap:8,justifyContent:'flex-end',flexWrap:'wrap'}}>
                {isEdit&&onDeleted&&<button type="button" onClick={del} disabled={busy} style={{...S.btnOut,color:'#dc2626',borderColor:'#fca5a5'}}>Delete</button>}
                <button type="button" onClick={onClose} style={S.btnOut}>Cancel</button>
                <button type="submit" disabled={busy} style={S.btnPri}>{busy?'Saving…':(isEdit?'Save':'Create')}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function AreasView({ user, onLogout, nav }) {
      const [areas,setAreas]=React.useState([]);
      const [groups,setGroups]=React.useState([]);
      const [tasks,setTasks]=React.useState([]);
      const [weekMins,setWeekMins]=React.useState({});
      const [plannedMins,setPlannedMins]=React.useState({});
      const [editing,setEditing]=React.useState(null); // {groupId} for new | area | null
      const [editingGroup,setEditingGroup]=React.useState(null); // 'new' | group | null
      const [err,setErr]=React.useState('');

      async function loadAll() {
        try {
          const { from, to } = weekRange(new Date());
          const now=new Date();
          const statsTo = to>now?now:to;      // elapsed portion of the week
          const planFrom = now>from?now:from;  // remaining portion of the week
          const gs=await api('/category-groups')||[]; setGroups(gs);
          setAreas(resolveAreas(await api('/categories')||[], gs));
          const t=await api('/tasks'); setTasks(t||[]);
          const s=await fetchStats(from,statsTo);
          const m={}; (s?.areas||[]).forEach(a=>{ if(a.area_id) m[a.area_id]=a.total_minutes; }); setWeekMins(m);
          const pm={};
          if(to>planFrom){
            const sp=await fetchStats(planFrom,to);
            (sp?.areas||[]).forEach(a=>{ if(a.area_id) pm[a.area_id]=a.total_minutes; });
          }
          setPlannedMins(pm);
        } catch(ex){ setErr(ex.message); }
      }
      React.useEffect(()=>{ loadAll(); },[]);

      async function toggleTask(t){ try{ await api(`/tasks/${t.id}`,{method:'PUT',body:JSON.stringify({done:!t.done})}); await loadAll(); }catch(ex){setErr(ex.message);} }
      async function addTask(areaId,title){ if(!title.trim())return; try{ await api('/tasks',{method:'POST',body:JSON.stringify({area_id:areaId||null,title:title.trim()})}); await loadAll(); }catch(ex){setErr(ex.message);} }
      async function delTask(id){ try{ await api(`/tasks/${id}`,{method:'DELETE'}); await loadAll(); }catch(ex){setErr(ex.message);} }

      const tasksByArea=React.useMemo(()=>{
        const m={};
        tasks.forEach(t=>{ const k=t.area_id||'none'; (m[k]=m[k]||[]).push(t); });
        return m;
      },[tasks]);
      const noAreaCard=()=>(
        <AreaCard key="none" area={{id:null,name:'No area',color:'#cbd5e1',weekly_target_minutes:0}} tasks={tasksByArea['none']} weekMins={0} plannedMins={0}
          onToggle={toggleTask} onAdd={addTask} onDel={delTask}/>
      );

      return (
        <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
          <TopBar title="Areas" workspace={nav.workspace} onWorkspace={nav.setWorkspace} user={user} onLogout={onLogout}>
            <TimerChip user={user} onLogged={loadAll}/>
            <button style={S.btnOut} onClick={()=>setEditingGroup('new')}>+ New group</button>
            <button style={S.btnPri} onClick={()=>setEditing({groupId:null})}><span style={{fontSize:18,lineHeight:1,marginTop:-1}}>+</span> New area</button>
          </TopBar>
          <div style={{flex:1,overflow:'auto',background:'var(--bg-subtle)'}}>
            <div style={{maxWidth:1100,margin:'0 auto',padding:'24px 20px 60px'}}>
              {err&&<div style={{color:'#dc2626',fontSize:13,marginBottom:14}}>{err}</div>}
              {groupAreas(areas,groups).map(({group,areas:sectionAreas})=>{
                const target=sectionAreas.reduce((n,a)=>n+(a.weekly_target_minutes||0),0);
                const logged=sectionAreas.reduce((n,a)=>n+(weekMins[a.id]||0),0);
                const showNone=!group&&(tasksByArea['none']||[]).length>0;
                return (
                  <section key={group?.id||'none'} style={{marginBottom:28}}>
                    {(groups.length>0)&&(
                      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                        {group&&<span style={{width:12,height:12,borderRadius:3,background:group.color,flexShrink:0}}/>}
                        <h2 style={{margin:0,fontSize:15,fontWeight:700}}>{group?group.name:'Ungrouped'}</h2>
                        {target>0&&<span style={{fontSize:12,color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{fmtMins(logged)} / {fmtMins(target)} this week</span>}
                        <span style={{flex:1}}/>
                        {group&&<button style={{...S.iconBtn,fontSize:13}} title={`Add area to ${group.name}`} onClick={()=>setEditing({groupId:group.id})}>+ Area</button>}
                        {group&&<button style={S.iconBtn} title={`Edit group ${group.name}`} aria-label={`Edit group ${group.name}`} onClick={()=>setEditingGroup(group)}>✎</button>}
                      </div>
                    )}
                    {group&&sectionAreas.length===0&&<div style={{color:'var(--text-muted)',fontSize:13}}>No areas in this group yet.</div>}
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:18,alignItems:'start'}}>
                      {sectionAreas.map(a=>(
                        <AreaCard key={a.id} area={a} tasks={tasksByArea[a.id]||[]} weekMins={weekMins[a.id]||0} plannedMins={plannedMins[a.id]||0}
                          onToggle={toggleTask} onAdd={addTask} onDel={delTask} onEdit={()=>setEditing(a)}/>
                      ))}
                      {showNone&&noAreaCard()}
                    </div>
                  </section>
                );
              })}
              {!groupAreas(areas,groups).some(sec=>!sec.group)&&(tasksByArea['none']||[]).length>0&&(
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:18,alignItems:'start'}}>{noAreaCard()}</div>
              )}
              {areas.length===0&&<div style={{color:'var(--text-muted)',fontSize:14,marginTop:20}}>No areas yet. Create one to start tracking goals and tasks.</div>}
            </div>
          </div>
          {editingGroup&&<GroupModal group={editingGroup==='new'?null:editingGroup} groups={groups} onClose={()=>setEditingGroup(null)}
            onSaved={async()=>{ setEditingGroup(null); await loadAll(); }}
            onDeleted={async()=>{ setEditingGroup(null); await loadAll(); }}/>}
          {editing&&<AreaModal area={editing.id?editing:null} defaultGroupId={editing.groupId} groups={groups} onClose={()=>setEditing(null)}
            onSaved={async()=>{ setEditing(null); await loadAll(); }}
            onDeleted={async()=>{ setEditing(null); await loadAll(); }}/>}
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // WORKSPACE ROUTER
    // ─────────────────────────────────────────────
    function Main({ user, onLogout }) {
      const [workspace,setWorkspace]=React.useState('calendar');
      const [logDay,setLogDay]=React.useState(null); // a day the Log view should open on
      const nav={
        workspace, logDay,
        setWorkspace:w=>{ setLogDay(null); setWorkspace(w); },
        openLog:day=>{ setLogDay(day); setWorkspace('log'); },
      };
      if(workspace==='log')   return <LogView user={user} onLogout={onLogout} nav={nav}/>;
      if(workspace==='areas') return <AreasView user={user} onLogout={onLogout} nav={nav}/>;
      return <CalendarApp user={user} onLogout={onLogout} nav={nav}/>;
    }

    // ─────────────────────────────────────────────
    // ROOT
    // ─────────────────────────────────────────────
    function App() {
      const [user,setUser]=React.useState(null);
      const [ready,setReady]=React.useState(false);
      React.useEffect(()=>{
        if(!getToken()){setReady(true);return;}
        api('/users/me').then(u=>{setUser(u);setReady(true);}).catch(()=>{clearToken();setReady(true);});
      },[]);
      if(!ready) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-muted)',fontSize:14}}>Loading…</div>;
      if(!user)  return <AuthPage onAuth={setUser}/>;
      return <Main user={user} onLogout={()=>{clearToken();setUser(null);}}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
